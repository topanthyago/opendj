[package]
name = "opendj-controllers"
description = "MIDI and HID controller support driven by Mixxx's own controller mappings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opendj-control = { path = "../control" }
opendj-script = { path = "../script" }
deckard-surface = { git = "https://github.com/topanthyago/Deckard", rev = "0510e7aba372c9c5ab4cd5508c51d98eea717a3b" }
base64 = "0.22"
# USB HID controllers (Native Instruments Traktor Kontrol and others). On
# Linux it uses the native hidraw backend shared with DECKARD; on macOS devices are opened shared,
# as Mixxx does, so another app can keep using them.
hidapi = { version = "2.6", default-features = false, features = ["linux-native-basic-udev", "macos-shared-device"] }
midir = "0.11"
roxmltree = "0.21"
rquickjs = { version = "0.14", features = ["classes", "properties"] }
serde_json = "1"

[dev-dependencies]
opendj-engine = { path = "../engine" }
